# This repository's own gates: the shipped template's hooks that apply to a
# Python, PowerShell, shell, and GitHub Actions package. CI runs the same file.
#
#     python -m pip install --require-hashes -r requirements-dev.txt
#     pre-commit install
#     pre-commit run --all-files
#
# Revisions are frozen to commit SHAs. Dependabot proposes updates; locally,
# `pre-commit autoupdate --freeze` does the same. Local hooks run tools from
# the active environment, so install requirements-dev.txt first.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: destroyed-symlinks
      # .gitattributes owns line endings; PowerShell stays CRLF by policy.
      - id: mixed-line-ending
        args: [--fix=no]
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-json
        exclude: ^templates/typescript/tsconfig\.strict\.json$
      - id: check-yaml
      - id: check-toml
      - id: check-xml
        files: \.props$
        types: [text]
      - id: detect-private-key

  # Staged changes only. CI scans full history with `gitleaks git` separately.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 6eaad039603a4de39fddd1cf5f727391efe9974e  # frozen: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: aab412d509121cb5f7533134b7e67f9fab59c682  # frozen: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/jendrikseipp/vulture
    rev: b0f67ba0044693aa9ec0d38fe460590facc98004  # frozen: v2.16
    hooks:
      - id: vulture
        args: [scripts, tests]

  # B404 flags every `import subprocess`; each call site is still checked by
  # B603/B607 and carries its own reviewed exception.
  - repo: https://github.com/PyCQA/bandit
    rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08  # frozen: 1.9.4
    hooks:
      - id: bandit
        args: [-q, -s, B404]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=style, --enable=all]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 05c1426671b9237fb5e1444dd63aa5731bec0dfb  # frozen: v3.13.1-1
    hooks:
      - id: shfmt
        args: [-i, '4', -ci, -sr, -d]

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
        args: [--no-progress, --offline]

  - repo: local
    hooks:
      # Entry scripts import `delivery`; tests import `scripts.delivery`. The two
      # module layouts need separate mypy runs, both with the shipped template.
      - id: mypy-scripts
        name: mypy (package scripts, shipped template)
        entry: python -m mypy --config-file templates/python/mypy.ini --python-version 3.12
          scripts/delivery scripts/verify-delivery.py scripts/update-delivery.py
          scripts/verify-format-safe.py
        language: system
        pass_filenames: false
        files: ^(scripts/.*\.py|templates/python/mypy\.ini)$

      - id: mypy-tests
        name: mypy (tests, shipped template)
        entry: python -m mypy --config-file templates/python/mypy.ini --python-version 3.12
          --explicit-package-bases tests
        language: system
        pass_filenames: false
        files: ^(scripts/.*\.py|tests/.*\.py|templates/python/mypy\.ini)$

      - id: psscriptanalyzer
        name: PSScriptAnalyzer (shipped template)
        entry: pwsh -NoLogo -NoProfile -NonInteractive -File tests/powershell-analysis.ps1
        language: system
        files: \.(ps1|psm1|psd1)$
