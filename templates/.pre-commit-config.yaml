# Polyglot strict pre-commit gate. Copy to project root, then:
#
#     pre-commit install                 # run on every commit
#     pre-commit run --all-files         # run over the whole repo now
#     pre-commit autoupdate              # bump pinned rev: pins
#
# Delete the language blocks a given project does not use — every hook that
# stays enabled must pass, so an unused block is pure friction.

fail_fast: false

repos:
  # ── universal hygiene ───────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-json
        # TypeScript configuration is JSONC; tsc owns its syntax validation.
        # Keep strict JSON validation for actual JSON files.
        exclude: '(^|/)tsconfig(?:\.[^/]+)?\.json$'
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key

  # ── secrets: scans staged changes; run `gitleaks git` separately for history
  - repo: https://github.com/gitleaks/gitleaks
    # v8.30.1 is an orphaned tag that `pre-commit autoupdate` cannot follow.
    # v8.30.0 was verified with a randomized, real-shape GitHub PAT canary.
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # ── Python ──────────────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        additional_dependencies: [types-requests, types-PyYAML]

  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture   # dead Python code

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit

  # ── Shell ───────────────────────────────────────────────────────────
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        args: [--severity=style, --enable=all]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: [-i, '4', -ci, -sr, -d]

  # ── C / C++ ─────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        types_or: [c, c++, cuda]

  # ── local: tools installed in the target project's environment ──────
  # `language: system` means pre-commit calls the binary on PATH instead of
  # building an isolated env. Install these as project-local dev dependencies
  # or otherwise pin them in the project's toolchain before enabling the hooks.
  - repo: local
    hooks:
      - id: eslint
        name: eslint (strict, type-checked)
        entry: eslint --max-warnings=0
        language: system
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: true

      - id: prettier
        name: prettier
        entry: prettier --write
        language: system
        types_or: [javascript, jsx, ts, tsx, css, scss, html, json, yaml, markdown]

      - id: stylelint
        name: stylelint (strict)
        entry: stylelint --max-warnings=0
        language: system
        types_or: [css, scss]

      - id: knip
        name: knip (unused files/exports/deps)
        entry: knip --strict
        language: system
        pass_filenames: false
        files: ^(package\.json|src/.*)$

      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy (deny warnings)
        # Select supported feature combinations if all-features is incompatible.
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-machete
        name: cargo machete (unused deps)
        entry: cargo machete
        language: system
        types: [rust]
        pass_filenames: false

      - id: cppcheck
        name: cppcheck (all checks)
        # Mixed C/C++ input must not be forced to a C++ standard. For CI use
        # the real compile database and whole-project unused-function analysis.
        entry: cppcheck --enable=all --inline-suppr --error-exitcode=1 --suppress=missingIncludeSystem --suppress=unusedFunction
        language: system
        types_or: [c, c++]

      - id: dotnet-format
        name: dotnet format --verify-no-changes
        entry: dotnet format --verify-no-changes --severity info
        language: system
        files: \.(cs|csproj|sln)$
        pass_filenames: false

      - id: psscriptanalyzer
        name: PSScriptAnalyzer (strict)
        # `pwsh` is the cross-platform host. On a Windows-only project that
        # supports only Windows PowerShell 5.1, replace it with `powershell`.
        entry: pwsh -NoProfile -Command "Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 -EnableExit"
        language: system
        files: \.(ps1|psm1|psd1)$
        pass_filenames: false
