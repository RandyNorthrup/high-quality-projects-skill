name: Release

"on":
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  quality:
    name: Reuse cross-platform quality gates
    permissions:
      contents: read
    uses: ./.github/workflows/cross-platform.yml

  publish:
    name: Build, attest, and publish
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build release artifacts
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/build-release.ps1 -OutputDirectory dist -Version $env:RELEASE_TAG -RequireTag
      - name: Attest release archives
        uses: actions/attest@v4
        with:
          subject-path: dist/high-quality-projects-skill-${{ github.ref_name }}.*
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $Assets = Get-ChildItem -LiteralPath dist -File |
              Select-Object -ExpandProperty FullName
          gh release create $env:RELEASE_TAG @Assets `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --title $env:RELEASE_TAG `
              --notes-file dist/RELEASE_NOTES.md `
              --latest
