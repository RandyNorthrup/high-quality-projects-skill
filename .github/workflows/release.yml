name: Release

"on":
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  quality:
    name: Reuse cross-platform quality gates
    permissions:
      contents: read
    # The self-repository `$/` form is not adopted until a tagged release run
    # has exercised it; this path cannot be tested without publishing.
    uses: ./.github/workflows/cross-platform.yml # zizmor: ignore[self-repository]

  publish:
    name: Build, attest, and publish
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The build reads the local tag; publication authenticates with
          # GH_TOKEN only in its own step, so no credential stays in .git.
          persist-credentials: false
      - name: Build release artifacts
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/build-release.ps1 -OutputDirectory dist -Version $env:RELEASE_TAG -RequireTag
      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/high-quality-projects-skill-${{ github.ref_name }}.*
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $Assets = Get-ChildItem -LiteralPath dist -File |
              Select-Object -ExpandProperty FullName
          gh release create $env:RELEASE_TAG @Assets `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --title $env:RELEASE_TAG `
              --notes-file dist/RELEASE_NOTES.md `
              --latest
