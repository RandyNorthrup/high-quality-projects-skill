name: Cross-platform package checks

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

# Supersede an older run for the same pull request; never cancel main or a
# release gate, whose results are recorded as evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Repository gates (pre-commit, full-history secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install hash-locked tools
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt
      - name: Install pinned PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          Import-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0
      - name: Run repository pre-commit gates
        run: python -m pre_commit run --all-files --show-diff-on-failure
      - name: Scan reachable history for secrets
        env:
          GITLEAKS_VERSION: 8.30.0
          # SHA-256 of gitleaks_8.30.0_linux_x64.tar.gz from the upstream release.
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" git --redact --no-banner .

  powershell:
    name: PowerShell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run PowerShell smoke tests
        shell: pwsh
        run: ./tests/cross-platform-smoke.ps1 -RedDrills
      - name: Build and inspect release package
        shell: pwsh
        run: ./tests/release-package-smoke.ps1

  windows-powershell:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Windows PowerShell smoke tests
        shell: powershell
        run: .\tests\cross-platform-smoke.ps1 -RedDrills
      - name: Build and inspect release package
        shell: powershell
        run: .\tests\release-package-smoke.ps1

  python-quality:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install hash-locked tools
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt
      - name: Type-check with the shipped mypy template
        run: |
          python -m compileall -q scripts tests
          python -m mypy --config-file templates/python/mypy.ini --python-version 3.12 scripts/delivery scripts/verify-delivery.py scripts/update-delivery.py scripts/verify-format-safe.py
          python -m mypy --config-file templates/python/mypy.ini --python-version 3.12 --explicit-package-bases tests
      - name: Run tests, validator red drills, and the coverage floor
        run: |
          python -m coverage run -m unittest discover -s tests -p "test_*.py"
          python -m coverage combine
          python -m coverage report

  posix:
    name: Bash and PowerShell parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare native scanner results
        shell: bash
        run: |
          set -euo pipefail
          test "$(bash scripts/skill-root.sh)" = "$GITHUB_WORKSPACE"

          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          bash scripts/detect-stack.sh . > "$scratch/bash.json"
          pwsh -NoLogo -NoProfile -File scripts/detect-stack.ps1 . > "$scratch/powershell.json"

          # A POSIX directory name may contain characters JSON must escape.
          awkward="$scratch/"$'quote"back\\slash\ttab'
          mkdir -p "$awkward/src"
          touch "$awkward/src/App.PY"
          bash scripts/detect-stack.sh "$awkward" > "$scratch/awkward.json"

          python - "$scratch/bash.json" "$scratch/powershell.json" "$scratch/awkward.json" "$awkward" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as bash_file:
              bash_scan = json.load(bash_file)
          with open(sys.argv[2], encoding="utf-8-sig") as powershell_file:
              powershell_scan = json.load(powershell_file)

          for section in (
              "git",
              "languages",
              "existing_config",
              "lockfiles",
              "toolchain_pins",
              "tools_installed",
              "python_runtime",
          ):
              if bash_scan[section] != powershell_scan[section]:
                  raise SystemExit(f"scanner mismatch in {section}")

          with open(sys.argv[3], encoding="utf-8") as awkward_file:
              awkward_scan = json.load(awkward_file)
          if os.path.realpath(awkward_scan["root"]) != os.path.realpath(sys.argv[4]):
              raise SystemExit("scanner root was not escaped as the exact directory name")
          if awkward_scan["languages"]["python"] != 1:
              raise SystemExit("uppercase extension was not counted")
          PY
