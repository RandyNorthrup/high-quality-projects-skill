name: Cross-platform package checks

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  powershell:
    name: PowerShell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Run PowerShell smoke tests
        shell: pwsh
        run: ./tests/cross-platform-smoke.ps1 -RedDrills
      - name: Build and inspect release package
        shell: pwsh
        run: ./tests/release-package-smoke.ps1

  windows-powershell:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Run Windows PowerShell smoke tests
        shell: powershell
        run: .\tests\cross-platform-smoke.ps1 -RedDrills
      - name: Build and inspect release package
        shell: powershell
        run: .\tests\release-package-smoke.ps1

  python-quality:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned quality tools
        run: python -m pip install --disable-pip-version-check ruff==0.16.4 mypy==2.3.1
      - name: Check Python scripts
        run: |
          python -m ruff check scripts tests
          python -m ruff format --check scripts tests
          python -m compileall -q scripts tests
          python -m mypy --strict --python-version 3.12 scripts/delivery scripts/verify-delivery.py scripts/update-delivery.py
      - name: Run native delivery tests and validator red drills
        run: python -m unittest discover -s tests -p 'test_*.py'

  posix:
    name: Bash and PowerShell parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Compare native scanner results
        shell: bash
        run: |
          set -euo pipefail
          test "$(bash scripts/skill-root.sh)" = "$GITHUB_WORKSPACE"

          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          bash scripts/detect-stack.sh . > "$scratch/bash.json"
          pwsh -NoLogo -NoProfile -File scripts/detect-stack.ps1 . > "$scratch/powershell.json"

          python - "$scratch/bash.json" "$scratch/powershell.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as bash_file:
              bash_scan = json.load(bash_file)
          with open(sys.argv[2], encoding="utf-8-sig") as powershell_file:
              powershell_scan = json.load(powershell_file)

          for section in (
              "git",
              "languages",
              "existing_config",
              "tools_installed",
              "python_runtime",
          ):
              if bash_scan[section] != powershell_scan[section]:
                  raise SystemExit(f"scanner mismatch in {section}")
          PY
